; PHP runtime overrides for the siteworks app container.
; Loaded as conf.d/zz-app.ini so it wins over upstream defaults.

; CLI / Pest ceiling. Pest accumulates fixtures across the whole suite;
; 128M OOMs mid-run on this codebase, and 256M still failed around ~268M.
; 512M covers the full suite with headroom.
;
; FPM workers are pinned tighter (256M) via docker/app/php-fpm-overrides.conf
; which uses php_admin_value to override this for the [www] pool only.
; Production request memory should still be monitored separately.
memory_limit = 512M

; Suppress the X-Powered-By header. Removing it from Symfony's header bag is a
; no-op — PHP emits it at the SAPI layer before the framework sees the response —
; so AgentsSecurityHeaders can only document the requirement, not enforce it.
expose_php = Off
