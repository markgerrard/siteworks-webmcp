server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Livewire uploads (logos, hero photos, project images) validate up to
    # 8MB app-side; nginx's 1m default was 413-ing anything over ~1MB
    # before the app ever saw it. 12m leaves headroom over the app cap.
    client_max_body_size 12m;

    # Public CSP collector — do not inherit the 12m upload ceiling.
    location = /csp-report {
        client_max_body_size 16k;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Belt and braces with expose_php=Off in docker/app/php.ini. PHP emits
        # X-Powered-By at the SAPI layer, so the app cannot remove it, and a php.ini
        # change only takes effect on an image rebuild. Hiding it here means an un-rebuilt
        # or drifted image cannot leak the version either.
        fastcgi_hide_header X-Powered-By;
    }
}
