; FPM-only overrides for the siteworks app pool.
; Loaded as zzz-overrides.conf so it wins over www.conf and zz-docker.conf.
;
; The CLI gets 512M (see docker/app/php.ini) so Pest's whole-suite
; fixture accumulation doesn't OOM. FPM workers serve one request at
; a time and don't need that ceiling — keep them on a tighter 256M
; until real per-request data argues otherwise.

[www]
php_admin_value[memory_limit] = 256M

; Upload ceilings above the app's 8MB validation cap (nginx allows 12m) —
; PHP's 2M/8M defaults were the next bottleneck after the nginx 413 fix.
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
